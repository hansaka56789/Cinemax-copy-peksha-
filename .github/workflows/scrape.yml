name: Scrape CinemaxLK

on:
  schedule:
    - cron: '0 */6 * * *'   # පැය 6 කට සැරේ
  workflow_dispatch:          # manual run button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install cheerio

      - run: node scraper.js

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update scraped data [skip ci]"
          git push
